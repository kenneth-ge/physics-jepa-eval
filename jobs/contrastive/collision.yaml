name: kenny-collision

# Collision mass-sensitivity eval, all 4 models — self-contained
# (renders + precomputes + prints the per-factor sweep table to the job log).
#   sky jobs launch -n kenny-collision -y jobs/contrastive/collision.yaml

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: encode-only-feature-extraction

workdir: .

volumes:
  /data: kenny-data

envs:
  MUJOCO_GL: egl
  HF_HOME: /data/hf

setup: |
  sudo apt-get update -qq
  sudo apt-get install -y -qq libegl1 libgl1 libosmesa6 libglib2.0-0 ffmpeg
  pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cu128
  pip install -q "transformers>=4.53" accelerate mujoco "imageio[ffmpeg]" numpy
  bash scripts/setup_qwen.sh
  bash scripts/setup_cosmos.sh
  bash scripts/setup_fastwam.sh
  bash scripts/setup_fastwam_stage2.sh

run: |
  set +e
  COLL=/data/videos/collision
  rm -rf $COLL
  ENC="saved:vjepa2_raw saved:vjepa2_mean saved:qwen3vl_raw saved:qwen3vl_mean saved:cosmos_raw saved:cosmos_mean saved:fastwam_raw saved:fastwam_mean"

  echo "=== render collision (stereo) ==="
  python -m evals.contrastive.render_collision --out-root $COLL --seeds 8 --rig stereo

  echo "=== vjepa precompute ==="
  python -m evals.precompute --root $COLL --recursive --clips A B C --encoders vjepa2_raw vjepa2_mean

  ( source /data/qwen/venv/bin/activate
    python -m evals.precompute --root $COLL --recursive --clips A B C --encoders qwen3vl_raw qwen3vl_mean
  ) || echo "QWEN STEP FAILED"

  ( source /data/cosmos/venv/bin/activate
    python -m evals.precompute --root $COLL --recursive --clips A B C --encoders cosmos_raw cosmos_mean
  ) || echo "COSMOS STEP FAILED"

  ( source /data/fastwam/venv/bin/activate
    export FASTWAM_CONFIG=/data/fastwam/FastWAM/configs/model/fastwam.yaml
    export FASTWAM_CKPT=/data/fastwam/FastWAM/checkpoints/fastwam_release/libero_uncond_2cam224.pt
    export DIFFSYNTH_MODEL_BASE_PATH=/data/fastwam/FastWAM/checkpoints
    python -m evals.precompute --root $COLL --recursive --clips A B C --encoders fastwam_raw fastwam_mean

    echo "=== COLLISION SWEEP TABLE (mass via momentum transfer) ==="
    python -m evals.contrastive.aggregate_bounce --root $COLL --encoders $ENC
  ) || echo "FASTWAM/AGG STEP FAILED"
