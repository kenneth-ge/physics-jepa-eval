name: kenny-basics-fw

# Finish the basics comparison: only FastWAM (which failed in kenny-basics on a
# huggingface_hub version clash, now fixed) + the unified table. Renders and the
# vjepa/qwen/cosmos vectors already live on the volume, so this just encodes
# FastWAM and reads every model's saved vectors.
# Launch: sky jobs launch -n kenny-basics-fw -y jobs/contrastive/basics_fastwam.yaml

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: encode-only-feature-extraction

workdir: .

volumes:
  /data: kenny-data

envs:
  HF_HOME: /data/hf

setup: |
  sudo apt-get update -qq
  sudo apt-get install -y -qq ffmpeg libgl1 libglib2.0-0
  bash scripts/setup_fastwam.sh
  bash scripts/setup_fastwam_stage2.sh   # now leaves hub<1.0 for the runtime

run: |
  set +e
  FAMS="basic_color basic_position"

  ( source /data/fastwam/venv/bin/activate
    python -c "import huggingface_hub as h; print('hub', h.__version__)"
    export FASTWAM_CONFIG=/data/fastwam/FastWAM/configs/model/fastwam.yaml
    export FASTWAM_CKPT=/data/fastwam/FastWAM/checkpoints/fastwam_release/libero_uncond_2cam224.pt
    export DIFFSYNTH_MODEL_BASE_PATH=/data/fastwam/FastWAM/checkpoints
    for fam in $FAMS; do
      echo "=== fastwam precompute: $fam ==="
      python -m evals.precompute --root /data/videos/$fam --encoders fastwam_raw fastwam_mean
    done

    # Unified table needs only numpy (all encoders read saved vectors); run it
    # in the fastwam venv to avoid standing up a second torch environment.
    for fam in $FAMS; do
      echo "=== UNIFIED TABLE: $fam ==="
      python -m evals.contrastive.measure --root /data/videos/$fam --encoders \
          saved:vjepa2_raw saved:vjepa2_mean saved:qwen3vl_raw saved:qwen3vl_mean \
          saved:cosmos_raw saved:cosmos_mean saved:fastwam_raw saved:fastwam_mean
    done )
